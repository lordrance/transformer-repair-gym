model = "deepseek-chat"
num_rollouts = 1
shuffle = false
max_concurrent = 128
verbose = false
rich = true
server = false
push = true
output_dir = "/work/artifacts/raw/v1_smoke"

[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "transformer_repair"
docker_image = "trgym-v1:latest"
tiers = [
    "M",
    "H",
]
task_ids = [
    "m1_attention_regression",
]

[env.taskset.task]
judges = []
workdir = "/workspace/repo"
visible_timeout = 300
grade_timeout = 600
use_contract_layer = true

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.agent]
max_turns = 14

[env.agent.harness]
id = "bash"
forward_env = []
tool_timeout = 600.0
skills = []
edit = true
search = false

[env.agent.harness.env]

[env.agent.runtime]
allow = [
    "*",
]
block = []
type = "docker"
image = "python:3.11-slim"
workdir = "/app"

[env.agent.timeout]

[env.agent.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[legacy.args]

[legacy.extra_env_kwargs]

[client]
base_url = "https://api.deepseek.com/v1"
api_key_var = "DEEPSEEK_API_KEY"
type = "eval"

[client.headers]

[sampling]
max_tokens = 4096
