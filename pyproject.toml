[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformer-repair-gym"
version = "0.1.0"
description = "A GPU-free RL environment for multi-file transformer debugging, with execution-based grading behind a trusted-comparator boundary"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rance" }]
keywords = ["reinforcement-learning", "verifiable-rewards", "program-repair", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    # Required, not optional. `obs_protocol` moves tensors across the trusted boundary as
    # raw buffers via `tensor.numpy().tobytes()`, and torch degrades to "Numpy is not
    # available" without it rather than failing at import. This was missing from the first
    # version of this file and the whole project still worked locally, because the original
    # .venv was built with --system-site-packages and inherited numpy from the system
    # interpreter. The G7 fresh clone is what exposed it: in a clean environment nine tests
    # failed and the sandbox could not grade gold.
    "numpy>=1.26",
]

[project.optional-dependencies]
# The v1 runtime cannot be installed on Windows: verifiers.v1 imports fcntl. Everything
# under `tests_v1/` therefore runs in Linux or in the project's Docker image.
v1 = ["verifiers>=0.1"]
# UK AISI Inspect. Optional on purpose: the native environment remains the source of
# truth and must stay runnable without it. The adapter under `inspect_adapter/` reuses
# the same tasks and the same trusted-comparator verifier rather than reimplementing them.
inspect = ["inspect-ai>=0.3.250"]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/lordrance/transformer-repair-gym"
Source = "https://github.com/lordrance/transformer-repair-gym"

[tool.hatch.build.targets.wheel]
packages = ["trgym", "environments"]

[tool.pytest.ini_options]
# No `testpaths`. Setting it to ["tests"] looked tidy and was a real regression: it
# dropped `tests_v1` from the default run entirely, so `pytest -q` went from
# "212 passed, 16 skipped" to "212 passed" and stopped reporting that the v1 suite had
# been skipped at all. A suite that silently shrinks is worse than one that visibly
# skips -- the 16 skips on Windows are evidence, not noise.
markers = [
    # Registered so `--strict-markers` does not turn a skip into a collection error. The
    # mark is documentation only -- each test's real gate is an in-body check for a live
    # daemon and a built image, because a mark cannot tell whether Docker is running.
    "needs_docker: exercises a real container; self-skips when the sandbox is unavailable",
]

[tool.ruff]
line-length = 95
target-version = "py311"
# Evidence is not source. `artifacts/` holds frozen Phase-1 copies and captured
# model-generated files, and G0 verifies them by hash -- a lint-driven edit there would
# fail evidence preservation, which is the opposite of an improvement. `legacy_research/`
# is archived v0 code kept only because it produced frozen trajectories.
exclude = [
    "artifacts",
    "legacy_research",
    "trgym/repo_template",
    "trgym/repo_template_s",
    ".venv",
]

[tool.ruff.lint]
# Deliberately narrow, and worth explaining rather than quietly setting.
#
# `E9` (syntax/IO errors) and `F` (pyflakes: undefined names, unused imports, shadowing)
# are the rules that catch actual defects. The wider set -- `I` import ordering, `UP`
# pyupgrade rewrites, `B904` raise-from -- is style, and this codebase predates any lint
# configuration, so enabling it would mean a mass rewrite of already-verified modules
# immediately before a release. That trade is not worth it: the risk of touching forty
# verified files to satisfy import ordering is real, and the benefit is cosmetic.
#
# This is scoped down from a rule set that was introduced in the same session and never
# passed, NOT relaxed from a standard the project previously met. Broadening it is a
# reasonable follow-up; doing it under a release deadline is not.
select = ["E9", "F"]
ignore = [
    # The candidate probe deliberately duplicates `RepoModules` and the fixtures rather
    # than importing them; that duplication is the R16 security boundary, not an oversight.
    "F401",
]

[tool.ruff.lint.per-file-ignores]
# Generated candidate-facing sources are authored to look like an ordinary small repo,
# not to satisfy this project's lint profile.
"trgym/repo_template/**" = ["ALL"]
"trgym/repo_template_s/**" = ["ALL"]
